<style>
  :root{
    --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4;
    --ink:#141a20; --ink-2:#47525d; --ink-3:#6c7883;
    --line:#dbe1e7; --line-2:#c8d0d8;
    --accent:#0c7d8a; --accent-2:#0a5f6a; --accent-soft:#e0f0f2;
    --ok:#2f8f56; --ok-bg:#e5f3ea; --ok-line:#a9d8bd;
    --warn:#a8720c; --warn-bg:#f7efdb; --warn-line:#e3c483;
    --gap:#bf3b4e; --gap-bg:#fbe5e8; --gap-line:#eeaeb7;
    --font-display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-body:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,Cambria,serif;
    --font-mono:ui-monospace,"Cascadia Code","SF Mono","Segoe UI Mono",Menlo,Consolas,monospace;
    --maxw:1200px; --prose:800px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1116; --surface:#141a21; --surface-2:#1a222b;
      --ink:#e7ecf1; --ink-2:#a3afba; --ink-3:#74818d;
      --line:#26303a; --line-2:#333f4b;
      --accent:#2fc0d0; --accent-2:#5bd4e0; --accent-soft:#10333a;
      --ok:#4cc47e; --ok-bg:#12301f; --ok-line:#245a3a;
      --warn:#e0a63a; --warn-bg:#31260f; --warn-line:#5c4820;
      --gap:#e56b7d; --gap-bg:#331a1f; --gap-line:#5e3038;
    }
  }
  :root[data-theme="light"]{
    --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4;
    --ink:#141a20; --ink-2:#47525d; --ink-3:#6c7883;
    --line:#dbe1e7; --line-2:#c8d0d8;
    --accent:#0c7d8a; --accent-2:#0a5f6a; --accent-soft:#e0f0f2;
    --ok:#2f8f56; --ok-bg:#e5f3ea; --ok-line:#a9d8bd;
    --warn:#a8720c; --warn-bg:#f7efdb; --warn-line:#e3c483;
    --gap:#bf3b4e; --gap-bg:#fbe5e8; --gap-line:#eeaeb7;
  }
  :root[data-theme="dark"]{
    --bg:#0d1116; --surface:#141a21; --surface-2:#1a222b;
    --ink:#e7ecf1; --ink-2:#a3afba; --ink-3:#74818d;
    --line:#26303a; --line-2:#333f4b;
    --accent:#2fc0d0; --accent-2:#5bd4e0; --accent-soft:#10333a;
    --ok:#4cc47e; --ok-bg:#12301f; --ok-line:#245a3a;
    --warn:#e0a63a; --warn-bg:#31260f; --warn-line:#5c4820;
    --gap:#e56b7d; --gap-bg:#331a1f; --gap-line:#5e3038;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:17px; line-height:1.62;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .shell{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,4vw,40px)}

  /* ---------- Masthead ---------- */
  header.mast{padding:clamp(40px,7vw,84px) 0 34px; border-bottom:1px solid var(--line)}
  .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent); font-weight:600;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .eyebrow .sep{color:var(--ink-3)}
  h1.title{
    font-family:var(--font-display); font-weight:760;
    font-size:clamp(30px,5.4vw,52px); line-height:1.04; letter-spacing:-.022em;
    margin:.42em 0 .28em; max-width:16ch; text-wrap:balance;
  }
  .deck{
    font-size:clamp(17px,2.1vw,21px); color:var(--ink-2); max-width:60ch;
    line-height:1.5; margin:0;
  }
  .deck b{color:var(--ink); font-weight:600}
  .metabar{
    margin-top:26px; display:flex; flex-wrap:wrap; gap:8px 20px;
    font-family:var(--font-mono); font-size:12.5px; color:var(--ink-3);
  }
  .metabar b{color:var(--ink-2); font-weight:600}

  /* ---------- Layout with TOC rail ---------- */
  .body-grid{display:block}
  @media(min-width:1040px){
    .body-grid{display:grid; grid-template-columns:216px minmax(0,1fr); gap:48px; align-items:start}
    nav.toc{position:sticky; top:24px; align-self:start}
  }
  nav.toc{padding:30px 0 0}
  nav.toc .toc-h{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-3); margin:0 0 12px; font-weight:600;
  }
  nav.toc ol{list-style:none; margin:0; padding:0; counter-reset:toc}
  nav.toc li{counter-increment:toc; margin:2px 0}
  nav.toc a{
    display:block; text-decoration:none; color:var(--ink-2);
    font-family:var(--font-display); font-size:14px; line-height:1.35;
    padding:6px 10px 6px 30px; border-radius:7px; position:relative;
  }
  nav.toc a::before{
    content:counter(toc,decimal-leading-zero); position:absolute; left:8px;
    font-family:var(--font-mono); font-size:11px; color:var(--accent);
    top:8px; font-weight:600;
  }
  nav.toc a:hover{background:var(--surface-2); color:var(--ink)}
  @media(max-width:1039px){ nav.toc{display:none} }

  main{padding-top:8px; min-width:0}

  /* ---------- Sections & prose ---------- */
  section{padding:38px 0; border-bottom:1px solid var(--line); scroll-margin-top:20px}
  section:last-of-type{border-bottom:0}
  .sec-eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.13em;
    text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:8px;
  }
  h2{
    font-family:var(--font-display); font-weight:720; letter-spacing:-.016em;
    font-size:clamp(22px,3.2vw,30px); line-height:1.14; margin:0 0 .55em;
    max-width:24ch; text-wrap:balance;
  }
  h3{
    font-family:var(--font-display); font-weight:660; letter-spacing:-.008em;
    font-size:19px; line-height:1.25; margin:1.9em 0 .5em; color:var(--ink);
  }
  h4{
    font-family:var(--font-mono); font-weight:600; font-size:13px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-2); margin:1.5em 0 .5em;
  }
  p{max-width:var(--prose); margin:0 0 1.05em}
  main ul,main ol{max-width:var(--prose); margin:0 0 1.1em; padding-left:1.25em}
  main li{margin:.34em 0}
  strong{font-weight:600; color:var(--ink)}
  a.ref{color:var(--accent-2); text-decoration:none; border-bottom:1px solid transparent}
  :root[data-theme="dark"] a.ref{color:var(--accent)}
  @media(prefers-color-scheme:dark){a.ref{color:var(--accent)}}
  a.ref:hover{border-bottom-color:currentColor}

  code,.mono{font-family:var(--font-mono); font-size:.86em}
  p code,li code,td code{
    background:var(--surface-2); padding:.08em .38em; border-radius:5px;
    font-size:.82em; color:var(--ink); border:1px solid var(--line);
    white-space:nowrap;
  }
  .path{color:var(--ink-3); font-family:var(--font-mono); font-size:.8em; white-space:nowrap}

  /* ---------- Callouts ---------- */
  .callout{
    border:1px solid var(--line); border-left-width:3px; border-radius:10px;
    background:var(--surface); padding:18px 20px; margin:1.4em 0; max-width:var(--prose);
  }
  .callout .k{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    font-weight:600; margin-bottom:7px; display:block;
  }
  .callout p{margin:.2em 0}
  .callout.accent{border-left-color:var(--accent); background:var(--accent-soft)}
  .callout.accent .k{color:var(--accent-2)}
  :root[data-theme="dark"] .callout.accent .k{color:var(--accent-2)}
  @media(prefers-color-scheme:dark){.callout.accent .k{color:var(--accent-2)}}
  .callout.warn{border-left-color:var(--warn); background:var(--warn-bg)}
  .callout.warn .k{color:var(--warn)}
  .callout.gap{border-left-color:var(--gap); background:var(--gap-bg)}
  .callout.gap .k{color:var(--gap)}
  .callout.accent{background:var(--accent-soft)}

  /* ---------- Formula ---------- */
  .formula{
    font-family:var(--font-mono); font-size:14px; line-height:1.55;
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:9px; padding:13px 16px; margin:1em 0; max-width:var(--prose);
    overflow-x:auto; color:var(--ink);
  }
  .formula .lbl{color:var(--ink-3)}

  /* ---------- Tables ---------- */
  .tablewrap{overflow-x:auto; margin:1.2em 0 1.5em; border:1px solid var(--line);
    border-radius:11px; background:var(--surface)}
  table{border-collapse:collapse; width:100%; font-size:14px; min-width:640px}
  table.wide{min-width:820px}
  thead th{
    font-family:var(--font-mono); font-weight:600; font-size:11.5px; letter-spacing:.03em;
    text-transform:uppercase; text-align:left; color:var(--ink-2);
    background:var(--surface-2); padding:11px 14px; border-bottom:1px solid var(--line-2);
    position:sticky; top:0; vertical-align:bottom;
  }
  tbody td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top;
    line-height:1.42; color:var(--ink-2)}
  tbody tr:last-child td{border-bottom:0}
  tbody td:first-child{color:var(--ink); font-weight:500}
  tbody td .path,tbody td code{white-space:normal}
  td .mname{font-family:var(--font-mono); font-size:12.5px; color:var(--ink); font-weight:600; display:block}
  tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 34%, transparent)}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- Pills / badges ---------- */
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono);
    font-size:11px; font-weight:600; letter-spacing:.02em; padding:2px 8px 2px 6px;
    border-radius:20px; border:1px solid var(--line-2); white-space:nowrap; line-height:1.5;
  }
  .pill .dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:0 0 auto}
  .pill.ok{color:var(--ok); background:var(--ok-bg); border-color:var(--ok-line)}
  .pill.warn{color:var(--warn); background:var(--warn-bg); border-color:var(--warn-line)}
  .pill.gap{color:var(--gap); background:var(--gap-bg); border-color:var(--gap-line)}
  .pill.plain{color:var(--ink-3); background:var(--surface-2)}

  .legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin:.3em 0 1.1em; font-size:13px; align-items:center}
  .legend .lg{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2); font-family:var(--font-mono); font-size:11.5px}

  /* ---------- Verdict cards ---------- */
  .verdicts{display:grid; gap:14px; margin:1.3em 0; max-width:var(--prose)}
  .vcard{border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden}
  .vcard .vhead{display:flex; align-items:flex-start; gap:12px; padding:15px 18px 12px; border-bottom:1px solid var(--line)}
  .vbadge{font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.05em;
    padding:4px 9px; border-radius:6px; flex:0 0 auto; margin-top:1px}
  .vbadge.confirmed{color:#fff; background:var(--gap)}
  .vbadge.partial{color:var(--ink); background:var(--warn)}
  :root[data-theme="dark"] .vbadge.partial{color:#20160a}
  @media(prefers-color-scheme:dark){.vbadge.partial{color:#20160a}}
  .vcard .vclaim{font-family:var(--font-display); font-weight:600; font-size:15.5px; line-height:1.34; color:var(--ink); margin:0}
  .vcard .vbody{padding:13px 18px 16px; font-size:14px; color:var(--ink-2)}
  .vcard .vbody p{margin:.1em 0 .7em; max-width:none}
  .vcard .vbody .imp{margin-top:.4em; padding-top:.7em; border-top:1px dashed var(--line-2)}
  .vcard .vbody .imp .k{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:600; display:block; margin-bottom:3px}
  :root[data-theme="dark"] .vcard .vbody .imp .k{color:var(--accent-2)}
  @media(prefers-color-scheme:dark){.vcard .vbody .imp .k{color:var(--accent-2)}}

  /* ---------- Stage cards ---------- */
  .stages{display:grid; gap:16px; margin:1.4em 0; max-width:var(--prose)}
  .stage{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:0; overflow:hidden}
  .stage .shead{display:flex; align-items:baseline; gap:12px; padding:16px 20px 12px; background:var(--surface-2); border-bottom:1px solid var(--line)}
  .stage .snum{font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--accent); letter-spacing:.02em; flex:0 0 auto}
  :root[data-theme="dark"] .stage .snum{color:var(--accent-2)}
  @media(prefers-color-scheme:dark){.stage .snum{color:var(--accent-2)}}
  .stage .stitle{font-family:var(--font-display); font-weight:660; font-size:16.5px; color:var(--ink); line-height:1.25; margin:0}
  .stage .schip{margin-left:auto; flex:0 0 auto}
  .stage .sbody{padding:15px 20px 18px; font-size:14.5px}
  .stage .sbody ul{max-width:none; margin:.2em 0 .3em}
  .stage .grid2{display:grid; gap:4px 22px; grid-template-columns:1fr}
  @media(min-width:620px){.stage .grid2{grid-template-columns:1fr 1fr}}
  .stage .fld{margin:.6em 0}
  .stage .fld .k{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600; display:block; margin-bottom:3px}
  .stage .fld p{margin:0; font-size:13.5px; color:var(--ink-2); max-width:none}
  .stage .dod{margin-top:.7em; padding-top:.8em; border-top:1px dashed var(--line-2)}

  /* ---------- Misc ---------- */
  .lead{font-size:19px; line-height:1.5; color:var(--ink); max-width:var(--prose)}
  .lead b{color:var(--ink)}
  hr.soft{border:0; border-top:1px solid var(--line); margin:1.6em 0; max-width:var(--prose)}
  .foot{padding:34px 0 70px; color:var(--ink-3); font-size:13px; max-width:var(--prose)}
  .foot p{max-width:none; margin:.5em 0; font-size:13px; color:var(--ink-3)}
  .foot .mono{font-size:12px}
  .kexcerpt{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-2); background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; padding:10px 13px; margin:.7em 0; max-width:var(--prose); line-height:1.5}
  sup.fn{font-family:var(--font-mono); font-size:.62em; color:var(--accent); font-weight:600}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
  @media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
