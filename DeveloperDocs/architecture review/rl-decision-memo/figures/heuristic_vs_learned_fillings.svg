<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 618" role="img" aria-label="Four panels in a two-by-two grid. Rows are the two joint enclosures from the workflow, plan and fly; columns are a heuristic filling and a learned filling. The enclosures, inputs and outputs are identical across each row. In the heuristic column the first decision consults one input and two further inputs are drawn as dashed stubs that stop short; the plan-time chain runs once with no loop, and the flight-time band is chosen from the phase now and the next stop from the committed order. In the learned column all three inputs reach a value function trained on realised round closure; the plan-time search iterates over candidate pairs, and the flight-time policy chooses band and next stop together, trading rate now for phase later.">
<defs>
<marker id="p-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#171B1D"/></marker>
<marker id="p-nav" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B5B63"/></marker>
</defs>
<text x="305" y="24" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#414D51">HEURISTIC — a fixed rule in the slot</text>
<text x="865" y="24" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#1B5B63">LEARNED — a value function in the slot</text>
