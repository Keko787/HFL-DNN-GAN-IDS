<rect x="60" y="362" width="490" height="224" fill="none" stroke="#1B5B63" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="72" y="380" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#1B5B63">JOINT · FLY</text>
