<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 612" role="img" aria-label="Workflow of the joint optimisation across three swimlanes: scheduler, RF, and trajectory. In the plan phase, once per mission, demand feeds a joint search in which the contact band class sets range, range sets clustering, clustering sets the route, the route sets arrival times, and the predicted phase at each arrival sets predicted rate and dwell; the search iterates, then S3b gates the result and the plan is committed. In the fly phase, once per stop, the mule arrives, observes the phase, selects a band, which sets dwell and clock; the update is collected; a feasibility check decides whether to proceed to the next stop or return to re-plan. When the queue is exhausted the round closes and the next mission demand is emitted.">
<defs>
<marker id="w-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#171B1D"/></marker>
<marker id="w-nav" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B5B63"/></marker>
</defs>
<text x="120" y="22" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#77868B">PLAN — ONCE PER MISSION</text>
<text x="660" y="22" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#77868B">FLY — ONCE PER STOP</text>
<rect x="110" y="52" width="1090" height="160" fill="#E8ECEA" opacity="0.45"/>
<rect x="104" y="52" width="3" height="160" fill="#171B1D"/>
<text x="52" y="132" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#171B1D" transform="rotate(-90 52 132)">SCHEDULER · L2</text>
<rect x="104" y="224" width="3" height="160" fill="#A8630B"/>
<text x="52" y="304" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#A8630B" transform="rotate(-90 52 304)">RF · L1</text>
<rect x="110" y="396" width="1090" height="160" fill="#E8ECEA" opacity="0.45"/>
<rect x="104" y="396" width="3" height="160" fill="#1B5B63"/>
<text x="52" y="476" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#1B5B63" transform="rotate(-90 52 476)">TRAJECTORY · NAV</text>
<rect x="120" y="236" width="520" height="308" fill="none" stroke="#1B5B63" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="132" y="538" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#1B5B63">JOINT · search over (band class, route)</text>
<rect x="660" y="236" width="540" height="308" fill="none" stroke="#1B5B63" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="766" y="538" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#1B5B63">JOINT · (band, next stop) given the phase found</text>
<rect x="130" y="108" width="160" height="54" fill="#E8ECEA" stroke="#171B1D" stroke-width="1.5"/>
<rect x="130" y="108" width="3" height="54" fill="#171B1D"/>
<text x="144" y="129" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">Demand</text>
<text x="144" y="148" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">who · when · worth</text>
<rect x="470" y="108" width="160" height="54" fill="#E8ECEA" stroke="#C2CBC7"/>
<rect x="470" y="108" width="3" height="54" fill="#171B1D"/>
<text x="484" y="129" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">S3b feasibility</text>
<text x="484" y="148" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">feasible set + cost</text>
<rect x="670" y="108" width="160" height="54" fill="#E8ECEA" stroke="#C2CBC7"/>
<rect x="670" y="108" width="3" height="54" fill="#171B1D"/>
<text x="684" y="129" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">Collect update</text>
<text x="684" y="148" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">from served device</text>
<rect x="1040" y="108" width="160" height="54" fill="#E8ECEA" stroke="#C2CBC7"/>
<rect x="1040" y="108" width="3" height="54" fill="#1B5B63"/>
<text x="1054" y="129" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">Round closes</text>
<text x="1054" y="148" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">served set → dock</text>
<rect x="130" y="276" width="160" height="54" fill="#FBFCFB" stroke="#77868B" stroke-dasharray="5 4"/>
<rect x="130" y="276" width="3" height="54" fill="#A8630B"/>
<text x="144" y="297" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">Contact band class</text>
<text x="144" y="316" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">→ range</text>
<rect x="330" y="276" width="160" height="54" fill="#FBFCFB" stroke="#77868B" stroke-dasharray="5 4"/>
<rect x="330" y="276" width="3" height="54" fill="#A8630B"/>
<text x="344" y="297" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">Phase at arrival</text>
<text x="344" y="316" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">→ rate · dwell</text>
<rect x="670" y="276" width="160" height="54" fill="#FBFCFB" stroke="#77868B" stroke-dasharray="5 4"/>
<rect x="670" y="276" width="3" height="54" fill="#A8630B"/>
<text x="684" y="297" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">Select band</text>
<text x="684" y="316" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">→ rate → dwell</text>
<rect x="130" y="444" width="160" height="54" fill="#E8ECEA" stroke="#C2CBC7"/>
<rect x="130" y="444" width="3" height="54" fill="#1B5B63"/>
<text x="144" y="465" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">S3a clustering</text>
<text x="144" y="484" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">→ stops</text>
<rect x="330" y="444" width="160" height="54" fill="#E8ECEA" stroke="#C2CBC7"/>
<rect x="330" y="444" width="3" height="54" fill="#1B5B63"/>
<text x="344" y="465" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">Route + order</text>
<text x="344" y="484" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">→ arrival times</text>
<rect x="670" y="444" width="160" height="54" fill="#E8ECEA" stroke="#C2CBC7"/>
<rect x="670" y="444" width="3" height="54" fill="#1B5B63"/>
<text x="684" y="465" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">Arrive at stop k</text>
<text x="684" y="484" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">pose · clock · phase</text>
<rect x="850" y="444" width="160" height="54" fill="#FBFCFB" stroke="#77868B" stroke-dasharray="5 4"/>
<rect x="850" y="444" width="3" height="54" fill="#1B5B63"/>
<text x="864" y="465" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">Still feasible?</text>
<text x="864" y="484" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">given realised dwell</text>
<rect x="1040" y="444" width="160" height="54" fill="#E8ECEA" stroke="#C2CBC7"/>
<rect x="1040" y="444" width="3" height="54" fill="#1B5B63"/>
<text x="1054" y="465" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="#171B1D">Next stop</text>
<text x="1054" y="484" font-family="IBM Plex Mono, monospace" font-size="10" fill="#77868B">k ← k + 1</text>
<path d="M 210 164 L 210 274" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="222" y="222" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#77868B">candidates · urgency</text>
<path d="M 210 332 L 210 442" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="222" y="392" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#77868B">range</text>
<path d="M 292 471 L 328 471" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="310" y="462" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#77868B">stops</text>
<path d="M 410 442 L 410 332" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="422" y="392" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#77868B">arrival times</text>
<path d="M 350 332 Q 310 372 270 332" fill="none" stroke="#1B5B63" stroke-width="1.5" marker-end="url(#w-nav)"/>
<text x="310" y="370" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#1B5B63">iterate</text>
<path d="M 492 303 L 550 303 L 550 164" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="562" y="226" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#77868B">predicted cost</text>
<path d="M 632 135 L 650 135 L 650 471 L 668 471" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="624" y="300" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#414D51" transform="rotate(-90 624 300)">committed plan</text>
<path d="M 750 442 L 750 332" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="762" y="392" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#77868B">observed phase</text>
<path d="M 750 274 L 750 164" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="762" y="222" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#77868B">served</text>
<path d="M 832 303 L 890 303 L 890 442" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="902" y="380" text-anchor="start" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#77868B">dwell · clock</text>
<path d="M 1012 471 L 1038 471" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="1025" y="462" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#77868B">yes</text>
<path d="M 1120 500 L 1120 568 L 750 568 L 750 500" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="935" y="585" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#414D51">next stop · k + 1</text>
<path d="M 1120 442 L 1120 164" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="1112" y="392" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#77868B">queue empty → dock</text>
<path d="M 970 442 L 970 80 L 570 80 L 570 106" fill="none" stroke="#1B5B63" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#w-nav)"/>
<text x="770" y="74" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#1B5B63">no → re-plan the remaining queue · today: abort only</text>
<path d="M 1120 106 L 1120 42 L 210 42 L 210 106" fill="none" stroke="#171B1D" stroke-width="1.5" marker-end="url(#w-live)"/>
<text x="430" y="36" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#414D51">next mission's demand</text>
</svg>